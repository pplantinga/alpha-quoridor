board_size: 9
walls_per_player: 10

model:
  hidden_dim: 256
  num_blocks: 16
  use_compile: true

training:
  num_self_play_games: 512
  batch_size: 256
  lr: 0.001
  num_iterations: 128
  buffer_size: 60000
  num_workers: 15
  decay_epochs: 40

mcts:
  num_simulations: 1024
  c_puct: 1.5
  temperature: 0.7
  dirichlet_noise_alpha: 0.3
  dirichlet_noise_epsilon: 0.25
  temp_decay_move: 25

reward:
  progress_weight: 0.15   # per-step bonus for shortening own path to goal
  block_weight: 0.10      # per-step bonus for lengthening opponent's path to goal
  draw_penalty: -0.40     # base value for draw/timeout positions (strongly discourages oscillation)
  draw_heuristic_w: 0.4   # heuristic multiplier for draw positions
  move_penalty_weight: 0.0 # disabled for 100% pure targets
